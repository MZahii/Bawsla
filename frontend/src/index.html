<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Bawsla — La boussole du savoir</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bawsla (البوصلة) — la boussole du savoir. Plateforme e-learning guidée par l'IA." />
    <meta name="theme-color" content="#141C2C" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/svg/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/png/apple-touch-icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block"
      rel="stylesheet"
    />
    <script>
      // Applique le thème avant le premier rendu pour éviter un flash (voir ThemeService).
      (function () {
        try {
          var t = localStorage.getItem('bawsla.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
