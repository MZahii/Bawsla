<mat-card appearance="outlined">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }
  <mat-card-content>
    <div class="brand"><mat-icon>explore</mat-icon> Bawsla</div>
    <p>Connectez-vous à votre espace.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.hasError('email')) {
          <mat-error>Email invalide</mat-error>
        } @else {
          <mat-error>Email obligatoire</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input
          matInput
          [type]="hidePassword() ? 'password' : 'text'"
          formControlName="motDePasse"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword.set(!hidePassword())"
          [attr.aria-label]="hidePassword() ? 'Afficher le mot de passe' : 'Masquer le mot de passe'"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error>Mot de passe obligatoire</mat-error>
      </mat-form-field>

      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="loading()">Se connecter</button>
    </form>

    <p class="switch">Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
  </mat-card-content>
</mat-card>
