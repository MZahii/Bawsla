<section class="welcome">
  <h2 class="bw-h1">Bienvenue{{ auth.currentUser() ? ', ' + auth.currentUser()!.prenom : '' }}</h2>
  <p class="bw-body-lg bw-muted">{{ intro() }}</p>
</section>

<nav class="bw-grid modules" aria-label="Modules">
  @for (m of modules(); track m.route) {
    <a [routerLink]="m.route" class="bw-card module">
      <span class="module-icon" aria-hidden="true">
        <mat-icon>{{ m.icon }}</mat-icon>
      </span>
      <span class="module-label">{{ m.label }}</span>
      @if (m.description) {
        <span class="module-desc">{{ m.description }}</span>
      }
      <mat-icon class="module-arrow" aria-hidden="true">arrow_forward</mat-icon>
    </a>
  }
</nav>
