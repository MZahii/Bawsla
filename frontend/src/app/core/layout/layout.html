<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <div class="brand">
      <mat-icon>explore</mat-icon>
      <span>Bawsla</span>
    </div>
    <mat-nav-list>
      @for (item of menu(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          [activated]="rla.isActive"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="toolbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Ouvrir le menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="spacer"></span>
      @if (auth.currentUser(); as user) {
        <span class="user">
          {{ user.prenom }} {{ user.nom }}
          <span class="role">{{ roleLabel() }}</span>
        </span>
      }
      <button mat-icon-button matTooltip="Se déconnecter" (click)="auth.logout()" aria-label="Se déconnecter">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
