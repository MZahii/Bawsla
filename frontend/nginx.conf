server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API : transmise à la gateway (le front appelle /api en relatif). « ^~ » passe avant la règle des fichiers
    # statiques ci-dessous, sinon une URL d'API finissant par .png serait cherchée sur le disque.
    location ^~ /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 30m;   # PDF de cours : 25 Mo côté cours-service
        proxy_read_timeout 300s;    # génération IA (résumé, quiz, audio) parfois longue
        proxy_buffering off;
    }

    # Fichiers avec hash dans le nom : cache long
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Routing Angular (SPA) : toute URL inconnue renvoie index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
