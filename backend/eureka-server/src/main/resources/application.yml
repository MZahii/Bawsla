server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    # En dev, évite que Eureka garde des instances mortes après un redémarrage.
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
