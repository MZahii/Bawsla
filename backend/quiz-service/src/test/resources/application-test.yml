    url: jdbc:h2:mem:quiz;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

quiz:
  publication:
    # Pas de user-service en test d'API : FormateurVerifierTest couvre la vérification du contrat 4.
    verifier-formateur: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
