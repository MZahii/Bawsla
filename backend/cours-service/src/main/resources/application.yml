server:
  port: 8082

spring:
  application:
    name: cours-service
  config:
    # .env à la racine du dépôt (lancement depuis backend/cours-service ou depuis la racine)
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/bawsla_cours?serverTimezone=UTC
    username: ${MYSQL_USER:bawsla}
    password: ${MYSQL_PASSWORD:bawsla}
  servlet:
    multipart:
      # Marge au-dessus des limites métier (image 2 Mo, PDF 20 Mo) vérifiées dans FichierService.
      max-file-size: 25MB
      max-request-size: 26MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

cours:
  stockage:
    # Images et PDF des cours (noms UUID). En Docker, monter un volume sur ce dossier.
    dossier: ${COURS_STOCKAGE_DOSSIER:./uploads/cours}
  ia:
    # Délais de lecture des appels longs à l'IA (par la gateway), en secondes. Le script d'une explication prend souvent plus de 60 s.
    delai-script-secondes: 330
    delai-audio-secondes: 420
    delai-controle-secondes: 30
    # Fiche de révision : l'ai-service limite la fiche à 300 s au total (120 s par appel) ; on lit 30 s de plus.
    delai-fiche-secondes: 330
    # Résumé automatique local (le premier appel charge le modèle) et lecture d'une page par vision.
    delai-resume-secondes: 300
    # Une page peut passer par Gemini (90 s) puis par le modèle local (120 s) : 240 s au total par page.
    delai-vision-secondes: 240
    # Lecture locale lente : au plus ce nombre de pages lues en local par lancement (VISION_LOCALE_PAGES_MAX), le formateur relance ensuite.
    vision-locale-pages-max: ${VISION_LOCALE_PAGES_MAX:10}
  explication:
    # En dessous de ce nombre de caractères, le cours est jugé vide (PDF scanné…) : erreur claire, aucun appel à l'IA.
    texte-min-caracteres: 200

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
