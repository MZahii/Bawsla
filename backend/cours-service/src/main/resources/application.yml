server:
  port: 8082

spring:
  application:
    name: cours-service
  config:
    # .env à la racine du dépôt (lancement depuis backend/cours-service ou depuis la racine)
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/bawsla_cours?serverTimezone=UTC
    username: ${MYSQL_USER:bawsla}
    password: ${MYSQL_PASSWORD:bawsla}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
