spring:
  datasource:
    url: jdbc:h2:mem:forum;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

forum:
  pieces-jointes:
    dossier: target/test-pieces-jointes
