server:
  port: 8084

spring:
  application:
    name: forum-service
  config:
    # .env à la racine du dépôt (lancement depuis backend/forum-service ou depuis la racine)
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/bawsla_forum?serverTimezone=UTC
    username: ${MYSQL_USER:bawsla}
    password: ${MYSQL_PASSWORD:bawsla}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # Images jointes : 2 Mo contrôlés par le service (message clair), marge pour l'enveloppe multipart.
      max-file-size: 3MB
      max-request-size: 3MB
  cloud:
    openfeign:
      client:
        config:
          default:
            # Le forum se dégrade proprement si un service ne répond pas : délais courts.
            connect-timeout: 2000
            read-timeout: 5000

forum:
  pieces-jointes:
    dossier: ${FORUM_PIECES_JOINTES_DOSSIER:./data/pieces-jointes}
  rag:
    # Texte de cours de démonstration indexé tant que le texte réel des cours n'est pas disponible (plan §13).
    texte-demo: ${FORUM_RAG_TEXTE_DEMO:false}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
